@if (schema['x-swadit-swagger-schema']) {
  <swadit-swagger-schema-editor
    [(obj)]="obj" [id]="id">
  </swadit-swagger-schema-editor>
} @else {
  @if (schema['type']=='string' || schema['type']=='boolean') {
    <swadit-primitive-editor
      [schema]="schema" [(obj)]="obj" [id]="id">
    </swadit-primitive-editor>
  }
  @if (schema['type']=='array') {
    <swadit-array-editor
      [schema]="schema" [(obj)]="obj" [id]="id">
    </swadit-array-editor>
  }
  @if (schema['type']=='object') {
    <swadit-object-editor
      [schema]="schema" [(obj)]="obj" [id]="id" [group]="group">
    </swadit-object-editor>
  }
}
