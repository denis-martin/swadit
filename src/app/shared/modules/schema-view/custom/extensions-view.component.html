<table>
  <tbody>
    @for (k of getAdditionalKeys(obj); track k) {
      <tr>
        <td class="label-text">{{k}}</td>
        <td>
          @if (!isComplex(obj[k])) {
            <span>{{obj[k]}}</span>
          }
          @if (isComplex(obj[k])) {
            <markdown [data]="toYaml(obj[k]) | language: 'yaml'"></markdown>
          }
          @if (isComplex(obj[k])) {
            <pre><code highlight [innerHTML]="toYaml(obj[k])"></code></pre>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
