@if (obj) {
  <div class="schemaView">
    @if (obj['description']) {
      <markdown class="markdown" [data]="obj['description']"></markdown>
    }
    @if (obj['required']) {
      <p class="headerType">The request body is required.</p>
    }
    <swadit-content-view [content]="obj['content']"></swadit-content-view>
  </div>
}
